name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js modules
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production dependency audit
        run: npm run audit:production

      - name: Test
        run: npm test

      - name: VSCE Package
        run: npm run build

      - name: Build minimum-runtime smoke fixture
        run: npm run test:runtime:build

      - uses: actions/setup-node@v6
        with:
          node-version: 14.21.3

      - name: Packaged Node 14 runtime smoke
        run: node scripts/run-runtime-smoke.cjs 14

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js modules
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: VSCE Package
        run: npm run build
