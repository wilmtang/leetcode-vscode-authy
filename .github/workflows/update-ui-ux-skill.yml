name: Update UI/UX skill

on:
  schedule:
    - cron: '17 15 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-ui-ux-skill
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: github.repository == 'wilmtang/leetcode-vscode-authy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.base.outputs.commit }}
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - name: Check out main without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Record the checked base
        id: base
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Integrate upstream skill changes
        run: node scripts/update-ui-ux-skill.mjs

      - name: Validate the skill data and example search
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B .agents/skills/ui-ux-pro-max/scripts/validate_data.py
          python3 -I -B .agents/skills/ui-ux-pro-max/scripts/search.py 'keyboard focus modal' --domain ux --json \
            | python3 -c 'import json,sys; result=json.load(sys.stdin); assert result["domain"] == "ux" and result["count"] > 0'

      - name: Prepare the checked patch
        id: patch
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git diff --cached --binary --no-renames > "$RUNNER_TEMP/skill-update.patch"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Transfer the checked patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-update
          path: ${{ runner.temp }}/skill-update.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    environment: skill-updates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted main without the deploy key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download the checked patch
        if: needs.prepare.outputs.changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skill-update
          path: ${{ runner.temp }}/skill-update

      - name: Enforce skill-only scope and commit
        if: needs.prepare.outputs.changed == 'true'
        id: commit
        env:
          CHECKED_BASE: ${{ needs.prepare.outputs.base }}
        run: node scripts/stage-ui-ux-skill-update.mjs "$RUNNER_TEMP/skill-update/skill-update.patch" "$CHECKED_BASE"

      # Only this step receives write access. It executes Git and SSH, never
      # downloaded Python or instruction content. GitHub's host keys come from
      # its HTTPS metadata endpoint rather than an unauthenticated SSH scan.
      - name: Verify repository access and publish directly to main
        env:
          SKILL_UPDATE_SSH_KEY: ${{ secrets.SKILL_UPDATE_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ needs.prepare.outputs.changed }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit }}
        run: |
          if [ -z "$SKILL_UPDATE_SSH_KEY" ]; then
            echo 'The repository skill-update deploy key is not configured.' >&2
            exit 1
          fi
          key_dir="$(mktemp -d "$RUNNER_TEMP/skill-update-ssh.XXXXXX")"
          trap 'rm -rf "$key_dir"' EXIT
          chmod 700 "$key_dir"
          printf '%s\n' "$SKILL_UPDATE_SSH_KEY" > "$key_dir/key"
          chmod 600 "$key_dir/key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$key_dir/known_hosts"
          test -s "$key_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i '$key_dir/key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$key_dir/known_hosts'"
          remote="git@github.com:$GITHUB_REPOSITORY.git"
          git ls-remote "$remote" refs/heads/main >/dev/null
          if [ "$CHANGED" != true ]; then
            echo 'Skill is current; repository SSH access verified.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          git -c core.hooksPath=/dev/null push "$remote" HEAD:refs/heads/main
          published="$(git ls-remote "$remote" refs/heads/main | cut -f1)"
          test "$published" = "$COMMIT_SHA"
          echo "Published skill update: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
