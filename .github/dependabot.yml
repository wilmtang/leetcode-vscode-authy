# Dependency updates (adapted from better-peakbagger).
#
# Every npm group except runtime-major merges automatically once the required
# `main` checks pass;
# see `.github/workflows/dependabot-auto-merge.yml`. Cooldown is the only delay
# left in the version-update path, so it is what lets an ecosystem find a bad
# release before this repository takes it. GitHub Actions updates stay grouped
# but wait for review: they change what CI and the publish workflows run, which
# no required check exercises.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    versioning-strategy: increase
    open-pull-requests-limit: 3
    # Version updates wait out release churn. Security updates ignore cooldown.
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 21
    ignore:
      # The packaged runtime must keep working on VS Code's bundled Node 14
      # (see the Node 14 smoke in CI); these majors need a deliberate change.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # @types/vscode must not exceed engines.vscode; raise both together by hand.
      - dependency-name: "@types/vscode"
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      # Major updates of shipped code (sanitize-html is the webview XSS
      # boundary) always wait for review; the auto-merge workflow skips this
      # group. Listed first so it wins over the groups below.
      runtime-major:
        update-types: [major]
        patterns:
          - axios
          - fs-extra
          - highlight.js
          - katex
          - lodash
          - markdown-it
          - sanitize-html
      # Bundled into the shipped VS Code extension by esbuild.
      runtime:
        update-types: [minor, patch]
        patterns:
          - axios
          - fs-extra
          - highlight.js
          - katex
          - lodash
          - markdown-it
          - sanitize-html
      # Build, test and packaging only. Never reaches the VSIX.
      tooling:
        patterns:
          - "@types/*"
          - "@vscode/vsce"
          - adm-zip
          - esbuild
          - mocha
          - ovsx
          - tslint
          - typescript
          - web-ext
      # Catch-all so unmatched (incl. transitive) updates move together.
      remaining-npm:
        applies-to: version-updates
        patterns:
          - "*"
      # Security and version updates cannot share a pull request. Group every
      # npm security repair so the zero-advisory production audit is not
      # blocked by separately incomplete security pull requests.
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    cooldown:
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    groups:
      actions:
        patterns:
          - "*"
